<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>근처맛집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Gothic+A1:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    color-scheme: light;
    --paper:#F5F2EC;      /* page */
    --surface:#FFFFFF;    /* cards */
    --paper-2:#F0ECE4;    /* insets */
    --ink:#241F1A;
    --ink-soft:#6C635A;
    --ink-3:#A29889;
    --line:#E8E2D8;
    --seal:#C0392B;       /* accent (brick red) */
    --seal-ink:#FFF6F3;
    --amber:#E1A008;      /* star */
    --focus:#2F6FB3;
    --c-food:#BE4A38;
    --c-cafe:#2C7C6B;
    --elev:0 1px 2px rgba(40,28,16,.05), 0 10px 26px rgba(40,28,16,.07);
    --serif:"Noto Serif KR","Nanum Myeongjo",serif;
    --sans:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --paper:#15120F;
      --surface:#211D18;
      --paper-2:#2A251F;
      --ink:#EEE7DD;
      --ink-soft:#A89D8F;
      --ink-3:#7C7365;
      --line:#332D26;
      --seal:#E5735F;
      --seal-ink:#1B100C;
      --amber:#EBBA4E;
      --focus:#6EAAE2;
      --c-food:#E27D64;
      --c-cafe:#5EAB96;
      --elev:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#15120F;
    --surface:#211D18;
    --paper-2:#2A251F;
    --ink:#EEE7DD;
    --ink-soft:#A89D8F;
    --ink-3:#7C7365;
    --line:#332D26;
    --seal:#E5735F;
    --seal-ink:#1B100C;
    --amber:#EBBA4E;
    --focus:#6EAAE2;
    --c-food:#E27D64;
    --c-cafe:#5EAB96;
    --elev:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box}
  img{max-width:100%}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:36px 18px 120px}

  :where(a,button,input,select,textarea,[tabindex]):focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
    border-radius:8px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
    .row:hover{transform:none !important}
  }

  /* header */
  .brand{
    font-family:var(--serif);
    font-weight:900;
    font-size:clamp(30px,7vw,44px);
    line-height:1.12;
    letter-spacing:-.01em;
    color:var(--ink);
    text-wrap:balance;
  }
  .brand .dot{color:var(--seal)}
  .tagline{margin-top:8px;font-size:13px;color:var(--ink-soft)}
  .rule{height:1px;background:var(--line);margin:20px 0 0}

  /* view toggle (목록 / 지도) */
  .viewtabs{
    display:inline-flex;gap:3px;margin:18px 0 0;padding:4px;
    border:1px solid var(--line);border-radius:12px;background:var(--paper-2);
  }
  .vt{
    font:inherit;font-size:13px;font-weight:500;padding:6px 20px;border:none;border-radius:8px;
    background:transparent;color:var(--ink-soft);cursor:pointer;transition:background .12s,color .12s;
  }
  .vt.on{background:var(--ink);color:var(--paper);font-weight:700}

  /* tools */
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 4px}
  .chip{
    font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    cursor:pointer;transition:background .12s,color .12s,border-color .12s;
  }
  .chip:hover{border-color:var(--ink-3)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
  .roll{
    margin-left:auto;
    font-family:var(--sans);font-weight:700;
    font-size:14px;padding:9px 18px;border-radius:999px;border:none;
    background:var(--seal);color:var(--seal-ink);cursor:pointer;transition:filter .12s;
  }
  .roll:hover{filter:brightness(1.06)}

  /* add place */
  .add-toggle{
    width:100%;text-align:left;font:inherit;font-size:13.5px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    border-radius:12px;padding:13px 16px;cursor:pointer;margin-top:10px;transition:border-color .12s,color .12s;
  }
  .add-toggle:hover{border-color:var(--ink-3);color:var(--ink)}
  .addbox{
    padding:18px;border:1px solid var(--line);border-radius:16px;
    background:var(--surface);box-shadow:var(--elev);margin:10px 0 2px;
  }
  .addsearch{display:flex;gap:8px}
  .addsearch .js-search{
    flex:1;min-width:0;font:inherit;padding:10px 12px;
    border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);
  }
  .srch{
    font:inherit;font-size:13px;font-weight:700;padding:10px 18px;border:none;border-radius:10px;
    background:var(--seal);color:var(--seal-ink);cursor:pointer;flex:none;
  }
  .srch[disabled]{opacity:.6;cursor:default}
  .srch-empty{margin-top:8px;font-size:12px;color:var(--ink-soft)}
  .srch-list{margin-top:8px;display:flex;flex-direction:column;gap:1px;
    border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line)}
  .srch-item{
    display:grid;grid-template-columns:1fr auto;gap:2px 8px;
    text-align:left;font:inherit;padding:11px 13px;border:none;cursor:pointer;
    background:var(--surface);color:var(--ink);transition:background .1s;
  }
  .srch-item:hover{background:var(--paper-2)}
  .si-name{font-weight:700;font-size:14px}
  .si-cat{font-size:11px;color:var(--ink-soft);align-self:center;font-weight:700}
  .si-cat.food{color:var(--c-food)}
  .si-cat.cafe{color:var(--c-cafe)}
  .si-addr{grid-column:1/-1;font-size:11.5px;color:var(--ink-soft)}
  .srch-picked{margin-top:10px;font-size:12px;color:var(--seal);font-weight:500}
  .srch-picked b{color:var(--ink)}
  .addform{
    display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;
  }
  @media(min-width:580px){ .addform{grid-template-columns:2fr 1fr 2fr auto} }
  .addform input,.addform select{
    font:inherit;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--paper);color:var(--ink);min-width:0;
  }
  .addform .go{
    font-family:var(--sans);font-weight:800;font-size:14px;
    background:var(--seal);color:var(--seal-ink);border:none;border-radius:10px;
    padding:10px 22px;cursor:pointer;
  }

  /* banners */
  .banner{
    margin:16px 0 4px;padding:12px 16px;border-radius:12px;font-size:13px;
    background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);
  }
  .banner.warn{border-color:var(--seal);color:var(--seal)}
  .banner b{color:var(--ink);font-weight:700}

  /* list */
  .list{margin-top:14px}
  .list.is-example{opacity:.6}
  .list.is-example .row{cursor:default;box-shadow:none}
  .empty{padding:52px 10px;text-align:center;color:var(--ink-soft);font-size:14px}

  .row{
    display:grid;grid-template-columns:auto minmax(0,1fr) auto;
    column-gap:16px;row-gap:12px;align-items:start;
    background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:18px 20px;margin-bottom:12px;cursor:pointer;box-shadow:var(--elev);
    transition:transform .13s ease, box-shadow .13s ease, border-color .13s ease;
  }
  .row:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--seal) 30%,var(--line))}
  .row>*{min-width:0}
  .r-thumb{position:relative;width:76px;height:76px;flex:none}
  .r-thumb .pic{width:100%;height:100%;border-radius:14px;overflow:hidden;background:var(--paper-2)}
  .r-thumb .pic img{width:100%;height:100%;object-fit:cover;display:block}
  .r-thumb .pic .ph{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-weight:900;font-size:26px;color:#fff;
  }
  .r-thumb .pic .ph.food{background:var(--c-food)}
  .r-thumb .pic .ph.cafe{background:var(--c-cafe)}
  .rank{
    width:30px;height:30px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--sans);font-weight:800;font-size:12.5px;
    color:var(--ink-3);border:1.5px solid var(--line);background:var(--surface);
    font-variant-numeric:tabular-nums;
  }
  .rank.top{background:var(--seal);color:var(--seal-ink);border-color:var(--seal)}
  .r-thumb .rank{
    position:absolute;top:-7px;left:-7px;width:23px;height:23px;font-size:11px;
    box-shadow:0 1px 3px rgba(0,0,0,.22);
  }
  .r-name{font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.3;color:var(--ink);text-wrap:balance}
  .r-name .chev{color:var(--ink-3);font-weight:400;font-size:12px;font-family:var(--sans)}
  .r-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;font-size:12px;color:var(--ink-soft)}
  .cat{border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--paper-2);color:var(--ink-soft)}
  .cat.food{background:color-mix(in srgb,var(--c-food) 18%,var(--surface));color:var(--c-food)}
  .cat.cafe{background:color-mix(in srgb,var(--c-cafe) 18%,var(--surface));color:var(--c-cafe)}
  .meta-map{font:inherit;font-size:11px;font-weight:700;color:var(--seal);text-decoration:none;cursor:pointer}
  .meta-map:hover{text-decoration:underline}
  .dims{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px 22px;margin-top:13px;max-width:460px;
  }
  .dim{display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--ink-3)}
  .dim-l{width:42px;flex:none;color:var(--ink-soft);font-weight:500}
  .dim-bar{flex:1;height:6px;border-radius:999px;background:var(--paper-2);overflow:hidden}
  .dim-bar i{display:block;height:100%;background:var(--amber);border-radius:999px}
  .dim-v{font-family:var(--mono);width:22px;text-align:right;flex:none;font-variant-numeric:tabular-nums;color:var(--ink-soft)}

  .r-score{
    flex:none;text-align:center;min-width:66px;
    background:color-mix(in srgb,var(--seal) 7%,var(--surface));
    border:1px solid color-mix(in srgb,var(--seal) 20%,var(--line));
    border-radius:14px;padding:9px 12px 8px;
  }
  .r-score .num{
    font-family:var(--mono);font-size:22px;font-weight:600;line-height:1;
    color:var(--seal);font-variant-numeric:tabular-nums;
  }
  .stars{position:relative;display:inline-block;white-space:nowrap;color:var(--line);font-size:11px;letter-spacing:1px;margin-top:5px}
  .stars-fill{position:absolute;inset:0;overflow:hidden;color:var(--amber);white-space:nowrap}
  .r-score .cnt{
    font-family:var(--sans);font-size:10px;font-weight:500;
    color:var(--ink-soft);margin-top:5px;
  }

  .ext-rating{
    font:inherit;font-size:11px;font-weight:700;color:var(--ink-soft);
    text-decoration:none;cursor:pointer;
    background:var(--paper-2);border-radius:999px;padding:2px 8px;
  }
  .ext-rating:hover{color:var(--ink)}

  /* panel */
  .panel{grid-column:1 / -1;margin-top:12px;padding:16px 18px;border-radius:14px;background:var(--paper-2);cursor:default}
  .gsec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);margin-bottom:14px}
  .gsec-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink)}
  .gsec-h .gsec-score{color:var(--amber);font-weight:700}
  .gsec-h a{margin-left:auto;font-size:11px;font-weight:700;color:var(--focus);text-decoration:none}
  .grev{padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
  .grev:first-of-type{border-top:none}
  .grev-head{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .grev-head b{color:var(--ink)}
  .grev-star{color:var(--amber);font-weight:700;font-size:11px}
  .grev-w{color:var(--ink-3);font-size:11px}
  .grev-t{margin-top:3px;color:var(--ink-soft);line-height:1.5}
  .revs-h{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:2px}
  .rev{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
  .rev:last-of-type{border-bottom:none}
  .rev-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .rev-num{font-family:var(--mono);color:var(--seal);font-weight:700;font-size:15px}
  .rev-when{color:var(--ink-3);font-size:11px}
  .rev-cmt{margin-top:6px;color:var(--ink);line-height:1.55}
  .rev-dims{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
  .rev-actions{margin-left:auto;display:flex;gap:12px;flex:none}
  .rev-edit{font:inherit;font-size:11px;font-weight:700;color:var(--focus);background:none;border:none;cursor:pointer;padding:0}
  .rev-del{font:inherit;font-size:11px;color:var(--ink-3);background:none;border:none;cursor:pointer;padding:0}
  .rev-del:hover{color:var(--seal)}
  .rev.editing{border-left:3px solid var(--seal);padding-left:13px;margin-left:-16px;border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--seal) 7%,transparent)}
  .revform-edit{font-size:12px;font-weight:700;color:var(--seal)}
  .link-plain{font:inherit;font-size:12px;color:var(--ink-3);background:none;border:none;cursor:pointer;padding:0;margin-left:auto}

  .revform{margin-top:16px;display:grid;gap:12px}
  .rate-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}
  .rate-row{display:flex;align-items:center;gap:10px}
  .rate-row .lbl{width:46px;font-size:12px;font-weight:500;color:var(--ink-soft);flex:none}
  .rate{display:flex;gap:2px}
  .rate-star{
    font:inherit;font-size:24px;line-height:1;background:none;border:none;
    cursor:pointer;color:var(--line);padding:0 1px;transition:color .1s;
  }
  .rate-star:hover{color:color-mix(in srgb,var(--amber) 55%,var(--line))}
  .rate-star.on{color:var(--amber)}
  .revform textarea{
    font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);color:var(--ink);resize:vertical;min-height:46px;width:100%;
  }
  .revform-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .revform .go{
    font-family:var(--sans);font-weight:800;font-size:14px;
    background:var(--seal);color:var(--seal-ink);border:none;border-radius:10px;
    padding:10px 22px;cursor:pointer;
  }
  .link-danger{font:inherit;font-size:11.5px;color:var(--ink-3);background:none;border:none;cursor:pointer;padding:0;margin-left:auto}
  .link-danger:hover{color:var(--seal)}

  @media(max-width:470px){
    .wrap{padding:28px 14px 110px}
    .dims{grid-template-columns:1fr;max-width:none}
    .rate-grid{grid-template-columns:1fr}
    .row{column-gap:12px;padding:16px}
    .r-thumb{width:60px;height:60px}
    .r-thumb .pic{border-radius:12px}
    .r-thumb .pic .ph{font-size:21px}
    .r-score{min-width:58px;padding:8px 9px}
    .r-score .num{font-size:20px}
    .brand{font-size:clamp(26px,8vw,34px)}
  }

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);font-size:13px;font-weight:500;
    padding:12px 22px;border-radius:999px;z-index:50;
    box-shadow:0 10px 34px rgba(0,0,0,.28);max-width:90vw;text-align:center;
  }
  .foot{
    margin-top:26px;text-align:center;font-size:11px;color:var(--ink-3);
    font-family:var(--sans);
  }

  /* map */
  .mapmount{margin-top:12px;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--elev)}
  .map-host{height:480px;width:100%;background:var(--paper-2)}
  .map-note{margin-top:10px;font-size:12px;color:var(--ink-soft)}
  .map-note b{color:var(--ink)}
  @media(max-width:470px){ .map-host{height:400px} }

  .mk{
    width:28px;height:28px;border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    background:var(--amber);border:2.5px solid #fff;
    box-shadow:0 2px 7px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
  }
  .mk span{
    transform:rotate(45deg);color:#fff;
    font:800 11px/1 "Gothic A1",sans-serif;
  }
  .mk-food{background:var(--c-food)}
  .mk-cafe{background:var(--c-cafe)}

  .map-legend{
    margin-top:10px;display:flex;gap:16px;align-items:center;
    font-size:12px;color:var(--ink-soft);
  }
  .map-legend .lg{
    display:inline-block;width:11px;height:11px;border-radius:50%;
    margin-right:5px;vertical-align:-1px;
  }
  .lg-food{background:var(--c-food)}
  .lg-cafe{background:var(--c-cafe)}

  .leaflet-popup-content{font-family:"Gothic A1",sans-serif}
  .mpop-name{font-family:"Noto Serif KR",serif;font-weight:700;font-size:15px;color:#241F1A}
  .mpop-meta{font-size:12px;color:#6C635A;margin:3px 0 9px}
  .mpop-go{
    font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border:none;border-radius:8px;
    background:#C0392B;color:#fff;cursor:pointer;
  }
  .mpop-map{font-size:12px;font-weight:700;margin-left:10px;color:#2F6FB3;text-decoration:none}
  .leaflet-container{font-family:"Gothic A1",sans-serif}

  @keyframes pulse{
    0%{box-shadow:var(--elev),0 0 0 0 color-mix(in srgb,var(--seal) 45%,transparent)}
    70%{box-shadow:var(--elev),0 0 0 10px color-mix(in srgb,var(--seal) 0%,transparent)}
    100%{box-shadow:var(--elev)}
  }
  .row.pulse{animation:pulse 1.4s ease}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  "use strict";
  var CATS = ["한식","중식","일식","양식","분식","아시안","카페","기타"];
  var DIMS = [["taste","맛"],["price","가성비"],["mood","분위기"],["service","서비스"],["hygiene","위생"]];

  var EXAMPLES = [
    { id:"ex1", name:"할머니 손칼국수", category:"한식", address:"서울 강남구 테헤란로12길 34", createdAt:Date.now()-6.2e8,
      reviews:[
        { id:"exr1", taste:5, price:5, mood:3, service:4, hygiene:4, comment:"멸치육수가 진하다. 김치 리필 잘 됨", createdAt:Date.now()-5.1e8 },
        { id:"exr2", taste:4, price:5, mood:3, service:3, hygiene:4, comment:"11시 40분 전에 가야 웨이팅 없음", createdAt:Date.now()-2.7e8 }
      ] },
    { id:"ex2", name:"모퉁이 로스터리", category:"카페", address:"서울 강남구 강남대로 지하 396", createdAt:Date.now()-4.4e8,
      reviews:[

  function aggReviews(rs){

        sum = 0;
        for(j=0;j<rs.length;j++) sum += (+rs[j][k] || 0);
        dimAvg[k] = sum / rs.length;
      } else dimAvg[k] = 0;
    }
    var overall = 0;
    if(rs.length){ for(i=0;i<DIMS.length;i++) overall += dimAvg[DIMS[i][0]]; overall /= DIMS.length; }
    return { count: rs.length, dimAvg: dimAvg, overall: overall };

    var list = all.filter(applyFilter);
    list.sort(state.sort === "recent"
      ? function(a,b){ return (b.createdAt||0) - (a.createdAt||0); }
      : function(a,b){ return (b.overall - a.overall) || (b.count - a.count) || ((b.createdAt||0) - (a.createdAt||0)); });
    state._list = state._example ? [] : list.slice();
    state._rankMap = rankMap;

    var main;
    if(state.mode === "loading" && !loadedOnce){
      main = "";   // 첫 로딩 중엔 예시 카드 대신 배너만
    } else if(state.view === "map"){
      main = '<div id="mapmount" class="mapmount"></div>' +
        '<div class="map-legend"><span><i class="lg lg-food"></i>밥집</span><span><i class="lg lg-cafe"></i>카페</span></div>' +
        mapNoteHtml();
    } else {
      var body = list.length
        ? list.map(function(p){ return rowHtml(p, rankMap); }).join("")
        : '<div class="empty">조건에 맞는 가게가 없어요</div>';
      var foot = (state.mode === "online" && state.lastSync)
        ? '<div class="foot">자동 새로고침 중 · 마지막 반영 ' + relTime(state.lastSync) + '</div>'
        : "";
      main = '<div class="list ' + (state._example ? "is-example" : "") + '">' + body + '</div>' + foot;
    }

    app.innerHTML =
      headerHtml() + viewTabsHtml() + toolsHtml() + addHtml() + bannersHtml() +
      main +
      (state.toast ? '<div class="toast">' + esc(state.toast) + '</div>' : '');

    restoreFocus(f);

    if(state.view === "map") mountMap();

    if(state.view === "list" && state.highlightId){
      var el = app.querySelector('[data-row="' + cssEsc(state.highlightId) + '"]');
      state.highlightId = null;
      if(el){
        var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
        el.classList.add("pulse");
        setTimeout(function(){ el.classList.remove("pulse"); }, 1600);
      }
    }
  }

  /* ---------- map ---------- */
  function hasCoord(p){
    var la = +p.lat, ln = +p.lng;
    return la && ln && Math.abs(la) <= 90 && Math.abs(ln) <= 180;
  }
  function mapNoteHtml(){
    if(state._example) return '<div class="map-note">예시 상태예요. 가게를 등록하면 지도에 표시됩니다.</div>';
    if(!state._list.length) return '<div class="map-note">조건에 맞는 가게가 없어요.</div>';
    var withC = state._list.filter(hasCoord).length;
    var noC = state._list.length - withC;
    if(!withC) return '<div class="map-note">아직 좌표가 있는 가게가 없어요. <b>(관리자: Apps Script에서 geocodeMissing 실행)</b></div>';
    if(noC) return '<div class="map-note">' + noC + '곳은 주소를 좌표로 변환하지 못해 지도에 없어요.</div>';
    return "";
  }
  function pin(rank, isCafe){
    var cls = "mk " + (isCafe ? "mk-cafe" : "mk-food");
    return L.divIcon({
      className: "",
      html: '<div class="' + cls + '"><span>' + (rank || "") + '</span></div>',
      iconSize: [26, 26],
      iconAnchor: [13, 26],
      popupAnchor: [0, -24]
    });
  }
  function mpopHtml(p){
    var score = p.count ? (p.overall.toFixed(1) + " · 평가 " + p.count) : "평가 없음";
    return '<div class="mpop">' +
      '<div class="mpop-name">' + esc(p.name) + '</div>' +
      '<div class="mpop-meta">' + esc(p.category) + ' · ' + score + '</div>' +
      '<button class="mpop-go" data-goid="' + esc(p.id) + '">목록에서 보기</button>' +
      '<a class="mpop-map" href="' + mapUrl(p.name, p.address) + '" target="_blank" rel="noopener noreferrer">네이버지도</a>' +
    '</div>';
  }
  function onPopupOpen(){
    var b = document.querySelector('.leaflet-popup .mpop-go');
    if(!b) return;
    b.onclick = function(){
      var id = b.getAttribute("data-goid");
      state.view = "list";
      state.expandedId = id;
      state.highlightId = id;
      render();
    };
  }
  function mountMap(){
    var slot = document.getElementById("mapmount");
    if(!slot) return;
    if(typeof L === "undefined"){
      slot.innerHTML = '<div class="map-note" style="padding:40px 16px;text-align:center">지도를 불러오지 못했어요. 새로고침 해보세요.</div>';
      return;
    }
    if(!mapHostEl){
      mapHostEl = document.createElement("div");
      mapHostEl.className = "map-host";
    }
    slot.appendChild(mapHostEl);
    if(!lmap){
      lmap = L.map(mapHostEl, { scrollWheelZoom: true }).setView([37.6688, 127.0471], 14); // 도봉구
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }).addTo(lmap);
      lmarkers = L.layerGroup().addTo(lmap);
    }
    lmap.invalidateSize();
    syncMarkers();
  }
  var _markerSig = null, _markerById = {};
  function syncMarkers(){
    if(!lmap || !lmarkers) return;
    var pins = state._list.filter(hasCoord);
    var sig = pins.map(function(p){
      return p.id + ":" + p.lat + "," + p.lng + ":" + p.count + ":" + (state._rankMap[p.id] || 0);
    }).join("|");

    if(sig !== _markerSig){
      _markerSig = sig;
      _markerById = {};
      lmarkers.clearLayers();
      var pts = [];
      pins.forEach(function(p){
        var m = L.marker([+p.lat, +p.lng], { icon: pin(state._rankMap[p.id], p.category === "카페") });
        var tip = esc(p.name) + " · " + (p.count ? (p.overall.toFixed(1) + "점") : "평가 없음");
        m.bindTooltip(tip, { direction: "top", offset: [0, -22] });   // 마우스 오버
        m.bindPopup(mpopHtml(p), { minWidth: 180 });                  // 클릭
        m.on("popupopen", onPopupOpen);
        lmarkers.addLayer(m);
        _markerById[p.id] = m;
        pts.push([+p.lat, +p.lng]);
      });
      if(pts.length){
        lmap.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
      }
    }

    if(state._rollId){
      var mk = _markerById[state._rollId];
      state._rollId = null;
      if(mk){
        lmap.setView(mk.getLatLng(), Math.max(lmap.getZoom(), 15));
        mk.openPopup();
      } else {
        toast("그 가게는 지도에 위치 정보가 없어요");
      }
    }
  }

  /* ---------- actions ---------- */
  function clearEdit(){
    if(state.editingPlace){ state.draftReview[state.editingPlace] = emptyDraft(); }
    state.editingId = null;
    state.editingPlace = null;
  }
  function toggleExpand(id){
    var closing = state.expandedId === id;
    if(closing && state.editingPlace === id) clearEdit();
    state.expandedId = closing ? null : id;
    render();
  }
  function startEditReview(placeId, reviewId){
    var r = state.reviews.filter(function(x){ return x.id === reviewId; })[0];
    if(!r){ toast("평가를 찾지 못했어요"); return; }
    if(state.editingPlace && state.editingPlace !== placeId){
      state.draftReview[state.editingPlace] = emptyDraft();
    }
    var d = getDraft(placeId);
    DIMS.forEach(function(x){ d[x[0]] = +r[x[0]] || 0; });
    d.comment = r.comment || "";
    state.editingId = reviewId;
    state.editingPlace = placeId;
    state.expandedId = placeId;
    render();
    focusSel('[data-fk="rev-comment-' + placeId + '"]');
  }
  function cancelEdit(){
    clearEdit();
    render();
  }
  function doRoll(){
    if(state._example){ toast("가게를 추가하면 추천이 시작돼요"); return; }
    var pool = state._list;
    if(!pool.length){ toast("추천할 가게가 없어요"); return; }
    var unseen = pool.filter(function(p){ return p.count === 0; });
    var arr = unseen.length ? unseen : pool;
    var pick = arr[Math.floor(Math.random() * arr.length)];
    if(state.view === "map"){
      state._rollId = pick.id;
      render();
      return;
    }
    state.expandedId = pick.id;
    state.highlightId = pick.id;
    render();
  }
  function guardWrite(){
    if(state.mode === "offline"){ toast("서버에 연결되지 않았어요"); return false; }
    if(state.mode !== "online"){ toast("아직 불러오는 중이에요"); return false; }
    return true;
  }
  function doPlaceSearch(){
    var q = state.draftSearch.trim();
    if(q.length < 2){ toast("가게 이름을 2자 이상 입력해 주세요"); return; }
    if(state.mode !== "online"){ toast("아직 불러오는 중이에요"); return; }
    state.searchBusy = true; render();
    gsRun("searchPlaces", q).then(function(r){
      state.searchBusy = false;
      state.searchResults = (r && r.ok && r.items) ? r.items : [];
      if(r && !r.ok) toast(r.error === "no_key" ? "카카오 키가 등록되지 않았어요" : "검색에 실패했어요");
      render();
    }).catch(function(e){
      state.searchBusy = false;
      state.searchResults = [];
      toast(friendly(e));
      render();
    });
  }
  function pickResult(i){
    var it = state.searchResults && state.searchResults[i];
    if(!it) return;
    state.draftPlace = {
      name: it.name || "",
      category: it.category || "기타",
      address: it.address || "",
      _lat: it.lat || 0,
      _lng: it.lng || 0
    };
    state.searchResults = null;
    render();
    focusSel('[data-act="add-place"]');
  }
  function doAddPlace(){
    if(!guardWrite()) return;
    var name = state.draftPlace.name.trim();
    var address = state.draftPlace.address.trim();
    if(!name){ toast("업체명을 입력해 주세요"); focusSel('[data-fk="place-name"]'); return; }
    if(!address){ toast("주소를 입력해 주세요"); focusSel('[data-fk="place-addr"]'); return; }
    var payload = { name: name, category: state.draftPlace.category, address: address };
    if(state.draftPlace._lat && state.draftPlace._lng){
      payload.lat = state.draftPlace._lat;
      payload.lng = state.draftPlace._lng;
    }
    toast("올리는 중…");
    gsRun("addPlace", payload).then(function(){
      state.draftPlace = { name:"", category: state.draftPlace.category, address:"" };
      state.draftSearch = "";
      state.searchResults = null;
      state.addOpen = false;
      toast("새 맛집을 추가했어요");
      loadAll(true);
    }).catch(function(e){ toast(friendly(e)); });
  }
  function doAddReview(placeId){
    if(!guardWrite()) return;
    var d = getDraft(placeId);
    var ok = true;
    for(var i=0;i<DIMS.length;i++){ if(!(d[DIMS[i][0]] >= 1)) ok = false; }
    if(!ok){ toast("모든 항목에 별점을 매겨 주세요"); return; }
    var payload = { comment: d.comment.trim() };
    for(var j=0;j<DIMS.length;j++){ payload[DIMS[j][0]] = d[DIMS[j][0]]; }

    var editingId = (state.editingPlace === placeId) ? state.editingId : null;
    if(editingId){
      payload.id = editingId;
      toast("수정 중…");
      gsRun("updateReview", payload).then(function(){
        clearEdit();
        toast("수정했어요");
        loadAll(true);
      }).catch(function(e){ toast(friendly(e)); });
      return;
    }
    payload.placeId = placeId;
    toast("저장 중…");
    gsRun("addReview", payload).then(function(){
      delete state.draftReview[placeId];
      toast("평가 고마워요!");
      loadAll(true);
    }).catch(function(e){ toast(friendly(e)); });
  }
  function doDelReview(id){
    if(!guardWrite()) return;
    if(!confirm("이 평가를 지울까요?")) return;
    gsRun("deleteReview", id).then(function(){
      toast("삭제했어요");
      loadAll(true);
    }).catch(function(e){ toast(friendly(e)); });
  }
  function doDelPlace(id){
    if(!guardWrite()) return;
    var p = state.places.filter(function(x){ return x.id === id; })[0];
    var cnt = state.reviews.filter(function(r){ return r.placeId === id; }).length;
    var msg = (p ? p.name : "이 가게") + " 기록을 삭제할까요?" + (cnt ? (" 리뷰 " + cnt + "개도 함께 지워집니다.") : "");
    if(!confirm(msg)) return;
    gsRun("deletePlace", id).then(function(){
      if(state.expandedId === id) state.expandedId = null;
      toast("삭제했어요");
      loadAll(true);
    }).catch(function(e){ toast(friendly(e)); });
  }
  function setStar(placeId, dim, val){
    var d = getDraft(placeId);
    d[dim] = (d[dim] === val) ? 0 : val;
    render();
  }

  /* ---------- event delegation ---------- */
  app.addEventListener("click", function(e){
    var actEl = e.target.closest("[data-act]");
    if(actEl){
      var act = actEl.dataset.act;
      if(act === "toggle-add"){ state.addOpen = !state.addOpen; if(!state.addOpen){ state.searchResults = null; } render(); return; }
      if(act === "add-place"){ doAddPlace(); return; }
      if(act === "place-search"){ doPlaceSearch(); return; }
      if(act === "pick"){ pickResult(+actEl.dataset.i); return; }
      if(act === "view"){ if(state.view !== actEl.dataset.val){ state.view = actEl.dataset.val; render(); } return; }
      if(act === "filter"){ state.filter = actEl.dataset.val; render(); return; }
      if(act === "sort"){ state.sort = state.sort === "rating" ? "recent" : "rating"; render(); return; }
      if(act === "roll"){ doRoll(); return; }
      if(act === "star"){ setStar(actEl.dataset.place, actEl.dataset.dim, +actEl.dataset.val); return; }
      if(act === "add-review"){ doAddReview(actEl.dataset.place); return; }
      if(act === "edit-review"){ startEditReview(actEl.dataset.place, actEl.dataset.id); return; }
      if(act === "cancel-edit"){ cancelEdit(); return; }
      if(act === "del-review"){ doDelReview(actEl.dataset.id); return; }
      if(act === "del-place"){ doDelPlace(actEl.dataset.id); return; }
      return;
    }
    if(e.target.closest("a")) return;
    if(e.target.closest(".panel")) return;
    var row = e.target.closest("[data-row]");
    if(row && !state._example) toggleExpand(row.dataset.row);
  });

  app.addEventListener("input", function(e){
    var t = e.target;
    if(t.classList.contains("js-place")){
      state.draftPlace[t.dataset.field] = t.value;
      // 직접 손대면 검색으로 잡은 좌표는 무효화
      state.draftPlace._lat = 0; state.draftPlace._lng = 0;
      var picked = app.querySelector(".srch-picked");
      if(picked) picked.hidden = true;
    }
    else if(t.classList.contains("js-search")){ state.draftSearch = t.value; }
    else if(t.classList.contains("js-cmt")){ getDraft(t.dataset.place).comment = t.value; }
  });

  app.addEventListener("change", function(e){
    if(e.target.dataset.act === "draft-cat"){ state.draftPlace.category = e.target.value; }
  });

  app.addEventListener("keydown", function(e){
    var t = e.target;
    if(t.classList && t.classList.contains("rate-star")){
      var stars = Array.prototype.slice.call(t.parentElement.querySelectorAll(".rate-star"));
      var i = stars.indexOf(t);
      if(e.key === "ArrowRight" || e.key === "ArrowUp"){ e.preventDefault(); (stars[i+1] || stars[i]).focus(); }
      else if(e.key === "ArrowLeft" || e.key === "ArrowDown"){ e.preventDefault(); (stars[i-1] || stars[i]).focus(); }
      return;
    }
    if(t.dataset && t.dataset.row != null && (e.key === "Enter" || e.key === " ")){
      e.preventDefault(); toggleExpand(t.dataset.row);
    }
    if(t.dataset && t.dataset.fk === "place-addr" && e.key === "Enter"){ e.preventDefault(); doAddPlace(); }
    if(t.dataset && t.dataset.fk === "place-search" && e.key === "Enter"){ e.preventDefault(); doPlaceSearch(); }
  });

  /* ---------- boot ---------- */
  render();
  loadAll(false);
  setInterval(function(){
    if(document.hidden) return;
    loadAll(true);
  }, 6000);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) loadAll(true);
  });
})();
</script>
</body>
</html>
